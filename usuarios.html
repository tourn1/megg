<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - El closet de Megg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #f8f5f2; padding-bottom: 30px; }
        .bg-dark-custom { background: #3d2c2c !important; }
        .btn-primary-custom { background: #b58383; border-color: #b58383; color: #fff; }
        .btn-primary-custom:hover { background: #9e6e6e; color: #fff; }
        .card-shadow { box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: none; border-radius: 16px; }
        .search-box { background: #fff; border-radius: 50px; padding: 0.3rem 1rem; border: 1px solid #ddd; }
        .search-box input { border: none; outline: none; background: transparent; width: 100%; padding: 0.4rem 0; }
        .search-box i { color: #b58383; }
        .brand-logo { font-weight: 700; font-size: 1.4rem; color: #f0e6e0 !important; text-decoration: none; }
        .brand-logo i { color: #d4a5a5; margin-right: 8px; }
        .navbar { border-radius: 0 0 20px 20px; padding: 0.8rem 1rem; }
        .navbar .nav-link { color: #f0e6e0 !important; }
        .navbar .nav-link.active, .navbar .nav-link:hover { color: #d4a5a5 !important; }
        .badge-activo { background: #a8c4a2; color: #2d4a2d; }
        .badge-inactivo { background: #e0d6d6; color: #6a5a5a; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="navbarContainer"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h3><i class="fas fa-user-cog"></i> Usuarios</h3>
        <button class="btn btn-primary-custom" id="btnNuevoUsuario"><i class="fas fa-plus"></i> Nuevo Usuario</button>
    </div>

    <div id="usuarioFormContainer" class="hidden mb-3 p-4 bg-white rounded-4 card-shadow">
        <h5 id="usuarioFormTitle">Nuevo Usuario</h5>
        <form id="usuarioForm">
            <input type="hidden" id="usuarioId">
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label>Usuario</label>
                    <input type="text" class="form-control" id="usuarioNombre" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label>Contraseña</label>
                    <input type="password" class="form-control" id="usuarioClave" required>
                </div>
                <div class="col-md-12 mb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="usuarioActivo" checked>
                        <label class="form-check-label" for="usuarioActivo">Activo</label>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary-custom" id="usuarioSubmitBtn">Guardar</button>
                <button type="button" class="btn btn-secondary" id="usuarioCancelBtn">Cancelar</button>
            </div>
        </form>
    </div>

    <div id="usuariosList">Cargando usuarios...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
    renderNavbar('usuarios');

    let currentPage = 1;
    let itemsPerPage = 10;

    async function cargarUsuarios() {
        const container = document.getElementById('usuariosList');
        try {
            const usuarios = await apiRequest('usuarios', 'GET');
            if (!Array.isArray(usuarios)) {
                throw new Error(typeof usuarios === 'object' && usuarios !== null ? (usuarios.error || JSON.stringify(usuarios)) : 'Respuesta inválida del servidor');
            }
            const search = getSearchTerm();
            const filtered = filterData(usuarios, search, ['usuario']);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No hay usuarios disponibles.</div>';
                return;
            }

            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const paginatedItems = filtered.slice(startIndex, endIndex);

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <label for="limitSelect" class="form-label mb-0 small text-muted">Mostrar:</label>
                    <select id="limitSelect" class="form-select form-select-sm" style="width: auto;">
                        <option value="10" ${itemsPerPage === 10 ? 'selected' : ''}>10</option>
                        <option value="50" ${itemsPerPage === 50 ? 'selected' : ''}>50</option>
                        <option value="100" ${itemsPerPage === 100 ? 'selected' : ''}>100</option>
                    </select>
                    <span class="small text-muted">registros por página</span>
                </div>
                <div class="small text-muted">
                    Mostrando ${totalItems > 0 ? startIndex + 1 : 0} a ${endIndex} de ${totalItems} usuarios
                </div>
            </div>
            <div class="table-responsive"><table class="table table-striped table-bordered align-middle">
                <thead class="table-light"><tr><th>Usuario</th><th>Estado</th><th style="width: 120px;">Acciones</th></tr></thead><tbody>`;
            paginatedItems.forEach(u => {
                const badge = u.activo ? '<span class="badge badge-activo">Activo</span>' : '<span class="badge badge-inactivo">Inactivo</span>';
                html += `<tr>
                    <td>${escapeHtml(u.usuario)}</td>
                    <td>${badge}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1 btn-edit" data-id="${u.id}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger btn-del" data-id="${u.id}"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table></div>';

            // Paginado UI
            if (totalPages > 1) {
                html += `<nav class="d-flex justify-content-center mt-3"><ul class="pagination pagination-sm mb-0">`;
                html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}">&laquo; Anterior</a>
                </li>`;
                for (let i = 1; i <= totalPages; i++) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>`;
                }
                html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}">Siguiente &raquo;</a>
                </li>`;
                html += `</ul></nav>`;
            }

            container.innerHTML = html;

            // Evento selector de límite
            const limitSelect = container.querySelector('#limitSelect');
            if (limitSelect) {
                limitSelect.addEventListener('change', (e) => {
                    itemsPerPage = parseInt(e.target.value);
                    currentPage = 1;
                    cargarUsuarios();
                });
            }

            // Eventos paginación
            container.querySelectorAll('.pagination .page-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetPage = parseInt(link.dataset.page);
                    if (targetPage && targetPage >= 1 && targetPage <= totalPages && targetPage !== currentPage) {
                        currentPage = targetPage;
                        cargarUsuarios();
                    }
                });
            });

            container.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => editarUsuario(usuarios, parseInt(btn.dataset.id)));
            });
            container.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', () => eliminarUsuario(parseInt(btn.dataset.id)));
            });
        } catch (e) {
            container.innerHTML = `<div class="alert alert-danger">Error al cargar usuarios: ${escapeHtml(e.message)}</div>`;
        }
    }

    function editarUsuario(usuarios, id) {
        const u = usuarios.find(item => item.id === id);
        if (!u) return;
        document.getElementById('usuarioId').value = u.id;
        document.getElementById('usuarioNombre').value = u.usuario || '';
        document.getElementById('usuarioClave').value = u.clave || '';
        document.getElementById('usuarioActivo').checked = u.activo == 1;
        document.getElementById('usuarioFormTitle').textContent = 'Editar Usuario';
        document.getElementById('usuarioSubmitBtn').textContent = 'Actualizar';
        document.getElementById('usuarioFormContainer').classList.remove('hidden');
    }

    async function eliminarUsuario(id) {
        if (id === 1) { alert('No se puede eliminar el usuario administrador por defecto.'); return; }
        if (!confirm('¿Desea eliminar este usuario?')) return;
        try {
            await apiRequest('usuarios', 'DELETE', { id });
            cargarUsuarios();
        } catch (e) {
            alert('Error al eliminar: ' + e.message);
        }
    }

    function resetUsuarioForm() {
        document.getElementById('usuarioId').value = '';
        document.getElementById('usuarioNombre').value = '';
        document.getElementById('usuarioClave').value = '';
        document.getElementById('usuarioActivo').checked = true;
        document.getElementById('usuarioFormTitle').textContent = 'Nuevo Usuario';
        document.getElementById('usuarioSubmitBtn').textContent = 'Guardar';
        document.getElementById('usuarioFormContainer').classList.add('hidden');
    }

    document.getElementById('btnNuevoUsuario').addEventListener('click', () => {
        resetUsuarioForm();
        document.getElementById('usuarioFormContainer').classList.remove('hidden');
    });

    document.getElementById('usuarioCancelBtn').addEventListener('click', resetUsuarioForm);

    document.getElementById('usuarioForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('usuarioId').value;
        const data = {
            usuario: document.getElementById('usuarioNombre').value.trim(),
            clave: document.getElementById('usuarioClave').value.trim(),
            activo: document.getElementById('usuarioActivo').checked ? 1 : 0
        };
        try {
            if (id) {
                data.id = parseInt(id);
                await apiRequest('usuarios', 'PUT', data);
            } else {
                await apiRequest('usuarios', 'POST', data);
            }
            resetUsuarioForm();
            cargarUsuarios();
        } catch (err) {
            alert('Error al guardar usuario: ' + err.message);
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.target.id === 'globalSearch') cargarUsuarios();
    });

    cargarUsuarios();
</script>
</body>
</html>
