<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - El closet de Megg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #f8f5f2; padding-bottom: 30px; }
        .bg-dark-custom { background: #3d2c2c !important; }
        .btn-primary-custom { background: #b58383; border-color: #b58383; color: #fff; }
        .btn-primary-custom:hover { background: #9e6e6e; color: #fff; }
        .card-shadow { box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: none; border-radius: 16px; }
        .search-box { background: #fff; border-radius: 50px; padding: 0.3rem 1rem; border: 1px solid #ddd; }
        .search-box input { border: none; outline: none; background: transparent; width: 100%; padding: 0.4rem 0; }
        .search-box i { color: #b58383; }
        .brand-logo { font-weight: 700; font-size: 1.4rem; color: #f0e6e0 !important; text-decoration: none; }
        .brand-logo i { color: #d4a5a5; margin-right: 8px; }
        .navbar { border-radius: 0 0 20px 20px; padding: 0.8rem 1rem; }
        .navbar .nav-link { color: #f0e6e0 !important; }
        .navbar .nav-link.active, .navbar .nav-link:hover { color: #d4a5a5 !important; }
        .hidden { display: none; }

        /* Foto preview */
        .foto-preview { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #d4a5a5; }
        .foto-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #d4a5a5; }
        .foto-placeholder { width: 40px; height: 40px; border-radius: 50%; background: #e8d5d5; display: inline-flex; align-items: center; justify-content: center; color: #b58383; font-size: 1rem; }

        /* File input */
        .file-input-wrapper { position: relative; }
        .file-input-wrapper input[type=file] { opacity: 0; position: absolute; inset: 0; cursor: pointer; }
        .file-input-btn { background: #f0e6e0; border: 1px dashed #b58383; border-radius: 8px; padding: 0.5rem 1rem; color: #9e6e6e; font-size: 0.85rem; cursor: pointer; display: inline-block; transition: 0.2s; }
        .file-input-btn:hover { background: #e8d5d5; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="navbarContainer"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h3><i class="fas fa-users"></i> Clientes</h3>
        <button class="btn btn-primary-custom" id="btnNuevoCliente"><i class="fas fa-plus"></i> Nuevo Cliente</button>
    </div>

    <div id="clienteFormContainer" class="hidden mb-3 p-4 bg-white rounded-4 card-shadow">
        <h5 id="clienteFormTitle">Nuevo Cliente</h5>
        <form id="clienteForm">
            <input type="hidden" id="clienteId">
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label>Nombre <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="clienteNombre" required>
                </div>
                <div class="col-md-6 mb-2">
                    <label>DNI</label>
                    <input type="text" class="form-control" id="clienteDni" placeholder="Ej: 20123456">
                </div>
                <div class="col-md-6 mb-2">
                    <label>Email</label>
                    <input type="email" class="form-control" id="clienteEmail">
                </div>
                <div class="col-md-6 mb-2">
                    <label>Teléfono</label>
                    <input type="text" class="form-control" id="clienteTelefono">
                </div>
                <div class="col-md-6 mb-2">
                    <label>Dirección</label>
                    <input type="text" class="form-control" id="clienteDireccion">
                </div>
                <div class="col-md-6 mb-2">
                    <label>Foto <small class="text-muted">(opcional)</small></label>
                    <div class="d-flex align-items-center gap-3">
                        <div id="fotoPreviewContainer">
                            <div class="foto-placeholder" id="fotoPlaceholder"><i class="fas fa-user"></i></div>
                            <img id="fotoPreviewImg" class="foto-preview hidden" alt="Foto">
                        </div>
                        <div class="file-input-wrapper">
                            <div class="file-input-btn"><i class="fas fa-camera me-1"></i>Elegir foto</div>
                            <input type="file" id="clienteFotoFile" accept="image/*">
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-secondary hidden" id="btnQuitarFoto">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <input type="hidden" id="clienteFoto">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary-custom" id="clienteSubmitBtn">Guardar</button>
                <button type="button" class="btn btn-secondary" id="clienteCancelBtn">Cancelar</button>
            </div>
        </form>
    </div>

    <div id="clientesList">Cargando clientes...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
    renderNavbar('clientes');

    // getFotoUrl and openLightbox are provided by app.js

    // ── Foto form handling ─────────────────────────────────────────────────────
    document.getElementById('clienteFotoFile').addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            setFotoPreview(e.target.result);
            document.getElementById('clienteFoto').value = e.target.result;
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('btnQuitarFoto').addEventListener('click', function() {
        clearFotoPreview();
        document.getElementById('clienteFoto').value = '';
        document.getElementById('clienteFotoFile').value = '';
    });

    function setFotoPreview(src) {
        const img = document.getElementById('fotoPreviewImg');
        const placeholder = document.getElementById('fotoPlaceholder');
        const btnQuitar = document.getElementById('btnQuitarFoto');
        const url = getFotoUrl(src);
        if (url && !url.startsWith('data:')) {
            img.src = url;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
            btnQuitar.classList.remove('hidden');
        } else if (src && src.startsWith('data:')) {
            // base64 (new upload preview, no stored yet)
            img.src = src;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
            btnQuitar.classList.remove('hidden');
        } else {
            clearFotoPreview();
        }
    }

    function clearFotoPreview() {
        const img = document.getElementById('fotoPreviewImg');
        const placeholder = document.getElementById('fotoPlaceholder');
        const btnQuitar = document.getElementById('btnQuitarFoto');
        img.src = '';
        img.classList.add('hidden');
        placeholder.classList.remove('hidden');
        btnQuitar.classList.add('hidden');
    }

    // ── Tabla de clientes ──────────────────────────────────────────────────────
    let currentPage = 1;
    let itemsPerPage = 10;

    async function cargarClientes() {
        const container = document.getElementById('clientesList');
        try {
            const clientes = await apiRequest('clientes', 'GET');
            if (!Array.isArray(clientes)) {
                throw new Error(typeof clientes === 'object' && clientes !== null
                    ? (clientes.error || JSON.stringify(clientes))
                    : 'Respuesta inválida del servidor');
            }
            const search = getSearchTerm();
            const filtered = filterData(clientes, search, ['nombre', 'email', 'telefono', 'direccion', 'dni']);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No hay clientes disponibles.</div>';
                return;
            }

            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const paginatedItems = filtered.slice(startIndex, endIndex);

            // Store full clients array for edit button usage (avoids huge data-* attrs)
            const clientesMap = {};
            clientes.forEach(c => { clientesMap[c.id] = c; });

            let html = `
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <label for="limitSelect" class="form-label mb-0 small text-muted">Mostrar:</label>
                    <select id="limitSelect" class="form-select form-select-sm" style="width: auto;">
                        <option value="10" ${itemsPerPage === 10 ? 'selected' : ''}>10</option>
                        <option value="50" ${itemsPerPage === 50 ? 'selected' : ''}>50</option>
                        <option value="100" ${itemsPerPage === 100 ? 'selected' : ''}>100</option>
                    </select>
                    <span class="small text-muted">registros por página</span>
                </div>
                <div class="small text-muted">
                    Mostrando ${totalItems > 0 ? startIndex + 1 : 0} a ${endIndex} de ${totalItems} clientes
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                <thead class="table-light"><tr>
                    <th style="width:50px;"></th>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th style="width:120px;">Acciones</th>
                </tr></thead><tbody>`;

            paginatedItems.forEach((c, idx) => {
                // Use data-idx to assign src later; avoids truncation of base64 in innerHTML
                const fotoHtml = c.foto
                    ? `<img class="foto-thumb" data-foto-idx="${idx}" alt="foto">`
                    : `<div class="foto-placeholder" style="width:36px;height:36px;font-size:.85rem;"><i class="fas fa-user"></i></div>`;

                html += `<tr>
                    <td class="text-center">${fotoHtml}</td>
                    <td>${escapeHtml(c.nombre)}</td>
                    <td>${escapeHtml(c.dni || '—')}</td>
                    <td>${escapeHtml(c.email || '—')}</td>
                    <td>${escapeHtml(c.telefono || '—')}</td>
                    <td>${escapeHtml(c.direccion || '—')}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1 btn-edit" data-id="${c.id}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger btn-del" data-id="${c.id}"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table></div>';

            // Paginado UI
            if (totalPages > 1) {
                html += `<nav class="d-flex justify-content-center mt-3"><ul class="pagination pagination-sm mb-0">`;
                html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}">&laquo; Anterior</a>
                </li>`;
                for (let i = 1; i <= totalPages; i++) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>`;
                }
                html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}">Siguiente &raquo;</a>
                </li>`;
                html += `</ul></nav>`;
            }

            container.innerHTML = html;

            // Evento selector de límite
            const limitSelect = container.querySelector('#limitSelect');
            if (limitSelect) {
                limitSelect.addEventListener('change', (e) => {
                    itemsPerPage = parseInt(e.target.value);
                    currentPage = 1;
                    cargarClientes();
                });
            }

            // Eventos paginación
            container.querySelectorAll('.pagination .page-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetPage = parseInt(link.dataset.page);
                    if (targetPage && targetPage >= 1 && targetPage <= totalPages && targetPage !== currentPage) {
                        currentPage = targetPage;
                        cargarClientes();
                    }
                });
            });

            // ✅ Assign src and lightbox click AFTER innerHTML
            container.querySelectorAll('img[data-foto-idx]').forEach(img => {
                const idx = parseInt(img.dataset.fotoIdx);
                const c = paginatedItems[idx];
                if (c && c.foto) {
                    const url = getFotoUrl(c.foto);
                    if (url) {
                        img.src = url;
                        img.style.cursor = 'zoom-in';
                        img.addEventListener('click', () => openLightbox(url, c.nombre));
                        img.onerror = () => {
                            img.style.display = 'none';
                            img.parentElement.innerHTML = `<div class="foto-placeholder" style="width:36px;height:36px;font-size:.85rem;"><i class="fas fa-user"></i></div>`;
                        };
                    }
                }
            });

            container.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const c = clientesMap[parseInt(btn.dataset.id)];
                    if (c) editarCliente(c);
                });
            });
            container.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', () => eliminarCliente(parseInt(btn.dataset.id)));
            });
        } catch (e) {
            container.innerHTML = `<div class="alert alert-danger">Error al cargar clientes: ${escapeHtml(e.message)}</div>`;
        }
    }

    // ── Editar ─────────────────────────────────────────────────────────────────
    function editarCliente(c) {
        document.getElementById('clienteId').value        = c.id;
        document.getElementById('clienteNombre').value    = c.nombre    || '';
        document.getElementById('clienteEmail').value     = c.email     || '';
        document.getElementById('clienteTelefono').value  = c.telefono  || '';
        document.getElementById('clienteDireccion').value = c.direccion || '';
        document.getElementById('clienteDni').value       = c.dni       || '';
        // Store existing path; only overwrite on new file selection
        document.getElementById('clienteFoto').value      = c.foto      || '';
        document.getElementById('clienteFotoFile').value  = '';

        // Show preview using correct URL
        if (c.foto && !c.foto.startsWith('data:')) {
            setFotoPreview(c.foto);
        } else {
            clearFotoPreview();
        }

        document.getElementById('clienteFormTitle').textContent    = 'Editar Cliente';
        document.getElementById('clienteSubmitBtn').textContent    = 'Actualizar';
        document.getElementById('clienteFormContainer').classList.remove('hidden');
        document.getElementById('clienteFormContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Eliminar ───────────────────────────────────────────────────────────────
    async function eliminarCliente(id) {
        if (!confirm('¿Desea eliminar este cliente?')) return;
        try {
            await apiRequest('clientes', 'DELETE', { id });
            cargarClientes();
        } catch (e) {
            alert('Error al eliminar: ' + e.message);
        }
    }

    // ── Reset form ─────────────────────────────────────────────────────────────
    function resetClienteForm() {
        document.getElementById('clienteId').value        = '';
        document.getElementById('clienteNombre').value    = '';
        document.getElementById('clienteEmail').value     = '';
        document.getElementById('clienteTelefono').value  = '';
        document.getElementById('clienteDireccion').value = '';
        document.getElementById('clienteDni').value       = '';
        document.getElementById('clienteFoto').value      = '';
        document.getElementById('clienteFotoFile').value  = '';
        clearFotoPreview();
        document.getElementById('clienteFormTitle').textContent  = 'Nuevo Cliente';
        document.getElementById('clienteSubmitBtn').textContent  = 'Guardar';
        document.getElementById('clienteFormContainer').classList.add('hidden');
    }

    document.getElementById('btnNuevoCliente').addEventListener('click', () => {
        resetClienteForm();
        document.getElementById('clienteFormContainer').classList.remove('hidden');
    });

    document.getElementById('clienteCancelBtn').addEventListener('click', resetClienteForm);

    // ── Submit ─────────────────────────────────────────────────────────────────
    document.getElementById('clienteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('clienteId').value;
        const data = {
            nombre:    document.getElementById('clienteNombre').value.trim(),
            email:     document.getElementById('clienteEmail').value.trim(),
            telefono:  document.getElementById('clienteTelefono').value.trim(),
            direccion: document.getElementById('clienteDireccion').value.trim(),
            dni:       document.getElementById('clienteDni').value.trim(),
            foto:      document.getElementById('clienteFoto').value
        };
        try {
            if (id) {
                data.id = parseInt(id);
                await apiRequest('clientes', 'PUT', data);
            } else {
                await apiRequest('clientes', 'POST', data);
            }
            resetClienteForm();
            cargarClientes();
        } catch (err) {
            alert('Error al guardar cliente: ' + err.message);
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.target.id === 'globalSearch') cargarClientes();
    });

    cargarClientes();
</script>
</body>
</html>
